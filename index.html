<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="La Pradera: cuida tus vacas, recoge leche y haz crecer tu pequeña granja.">
    <title>LaLa Cow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:opsz,wght@9..144,700;9..144,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="game-shell">
        <header class="topbar">
            <a class="brand" href="#start-screen" aria-label="LaLa Cow, inicio"><span class="brand-mark" aria-hidden="true">✦</span><span><strong>La Pradera</strong><small>granja lechera</small></span></a>
        </header>
        <section class="game-layout" id="start-screen">
            <div class="start-illustration" aria-hidden="true">
                <img src="images/cow.svg" alt="Vaca en la pradera">
            </div>
            <div class="start-content">
                <h1 class="start-title">¡Bienvenido a La Pradera!</h1>
                <p class="start-description">Nombra a tu granja!</p>
                <input type="text" class="start-input" id="farm-name-input" placeholder="Muuu wei" maxlength="20">
                <p id="farm-name-error" class="start-error" style="display:none;">El nombre de la granja es obligatorio.</p>
                <button class="start-button" id="start-button">Comenzar</button>
            </div>
        </section>
        <footer class="footer-note">
            <p>© 2026 LaLa Cow. OSWA.</p>
        </footer>
    </main>
    <script src="script.js"></script>
</body>
</html>
