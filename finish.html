<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>La Pradera | Cuidar las vacas</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:opsz,wght@9..144,700;9..144,800&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="styles.css">
    </head>

    <body>
        <main class="game-shell finish-shell">
            <header class="topbar">
                <a class="brand" href="index.html" aria-label="Volver al inicio">
                    <span class="brand-mark" aria-hidden="true">✦</span>
                    <span><strong>La Pradera</strong><small>granja lechera</small></span>
                </a>
            </header>
            <section class="game-over">
                <div class="finish-illustration" aria-hidden="true">
                    <img src="images/cow.svg" alt="">
                </div>
                <p class="eyebrow">Turno completado</p>
                <h1 id="game-over-title">¡Juego terminado!</h1>
                <p id="final-score">Puntaje final: 0</p>
                <p id="max-score">Puntaje máximo: 0</p>
                <button id="restart-button" class="start-button" type="button">Reiniciar juego</button>
            </section>
            <footer class="footer-note"><span>© 2026 LaLa Cow</span></footer>
        </main>
    
    </body>
    <script>
        document.addEventListener('DOMContentLoaded', function() {

            const score = localStorage.getItem('score');
            const maxScore = localStorage.getItem('maxScore');
            if(score === null){
                window.location.href = 'index.html';
                return;
            }
            localStorage.removeItem('score');
            document.getElementById('final-score').textContent = `Puntaje final: ${score}`;

            if(maxScore){
                document.getElementById('max-score').textContent = `Puntaje máximo: ${maxScore}`;
            }

            document.getElementById('restart-button').addEventListener('click', restartGame);
        });

        function restartGame() {
            window.location.href = 'index.html';
        }

    </script>
    
</html>
